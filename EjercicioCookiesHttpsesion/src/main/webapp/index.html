<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Datos usuario</title>
</head>
<body>

	<form action="Servlet1" method="post" autocomplete="off">
		Nombre: <input type="text" name="userName" required
			pattern="\s*[A-Za-zÁÉÍÓÚáéíóúÑñÜü]+(\s+[A-Za-zÁÉÍÓÚáéíóúÑñÜü]+)*\s*"
			title="Solo letras, sin números ni caracteres especiales" /><br />

		Apellido: <input type="text" name="userLastname" required
			pattern="\s*[A-Za-zÁÉÍÓÚáéíóúÑñÜü]+(\s+[A-Za-zÁÉÍÓÚáéíóúÑñÜü]+)*\s*"
			title="Solo letras, sin números ni caracteres especiales" /><br />

		Edad: <input type="number" name="userAge" min="1" max="110" step="1" required /><br />

		Ciudad: <input type="text" name="userCity" required
			pattern="\s*[A-Za-zÁÉÍÓÚáéíóúÑñÜü]+(\s+[A-Za-zÁÉÍÓÚáéíóúÑñÜü]+)*\s*"
			title="Solo letras, sin números ni caracteres especiales" /><br />

		Año de nacimiento: <input type="number" name="userYear" min="1916" max="2026" step="1" required /><br />

		<button type="submit" name="accion" value="registrar">Registrarse</button>
	</form>

	<script>
		window.addEventListener('pageshow', function(e) {
			if (e.persisted) { document.forms[0].reset(); }
		});
	</script>

</body>
</html>
